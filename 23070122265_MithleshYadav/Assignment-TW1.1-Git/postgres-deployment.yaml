apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:15

          env:
            - name: POSTGRES_DB
              value: flaskdb

            - name: POSTGRES_USER
              value: admin

            - name: POSTGRES_PASSWORD
              value: admin123

          ports:
            - containerPort: 5432
